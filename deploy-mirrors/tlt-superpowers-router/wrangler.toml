name = "tlt-superpowers-router"
main = "src/index.js"
compatibility_date = "2026-08-31"
workers_dev = true

[observability]
enabled = true

[vars]
SUPERPOWERS_MODE = "deterministic-routing"
GITHUB_WRITE_CANARY_ENABLED = "true"
GITHUB_WRITE_EXECUTION_ENABLED = "false"

[[durable_objects.bindings]]
name = "APPROVAL_LEDGER"
class_name = "ApprovalConsumptionLedger"

[[migrations]]
tag = "approval-ledger-v1"
new_sqlite_classes = ["ApprovalConsumptionLedger"]

[[services]]
binding = "GITHUB_WRITE"
service = "github-mcp-server"
entrypoint = "SuperpowersApprovedWriteEntrypoint"
