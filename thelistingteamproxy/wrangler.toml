name = "thelistingteamproxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Custom-domain binding: wrangler manages the DNS record + worker route in one
# step. Without custom_domain=true, the bare `pattern`/`zone_name` form
# requires a pre-existing proxied DNS record, which we don't have — so
# Cloudflare's edge returns host_not_allowed.
routes = [
  { pattern = "thelistingteamproxy.reallistingteam.com", custom_domain = true }
]

[vars]
# Which Transaction OS this dashboard reads. Production TOS moved to its own
# custom domain on 2026-08-13; the dashboard used to hardcode the workers.dev
# host in five places. See tosBase() in worker.js.
TOS_BASE_URL = "https://tos.reallistingteam.com"
DASHBOARD_ENV = "PRODUCTION"

# The Ylopo sidecar matrix worker holds the buyer behavioural data (views,
# saves, showings, intent score). A Worker cannot fetch another Worker on the
# same zone over its public hostname - Cloudflare returns error 1042 - so it is
# bound as a service and called internally.
[[services]]
binding = "YLOPO_MATRIX"
service = "ylopo-matrix-proxy"

# hub/16 user module: accounts, revocable sessions, durable lockout.
# Enabled on production 2026-08-18 per Scott's go. The worker feature-detects
# this binding; removing the block reverts to legacy shared-password auth.
[[d1_databases]]
binding = "DB"
database_name = "tlt-users"
database_id = "5c2336e0-056e-4d2e-9d9c-7b6b6a6a6a08"
