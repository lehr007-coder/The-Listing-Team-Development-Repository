name = "listing-team-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-10"
workers_dev = true

[vars]
GATEWAY_VERSION = "0.3.0"
SUPERPOWERS_ROUTER_BASE_URL = "https://tlt-superpowers-router.lehr007.workers.dev"

# Confirmed deployed upstream Workers.
IDX_BRIDGE_BASE_URL = "https://idx-mcp-bridge.lehr007.workers.dev"
LEAD_SCORER_BASE_URL = "https://voice-ai-lead-scorer.lehr007.workers.dev"

# These upstream repositories exist but are not currently deployed in this
# Cloudflare account. Leave them blank so /health reports them unconfigured.
PROPERTY_DATA_BASE_URL = ""
MORTGAGE_BASE_URL = ""
RETURNING_CALLER_BASE_URL = ""
CALL_QUALITY_BASE_URL = ""

[[services]]
binding = "SUPERPOWERS_ROUTER"
service = "tlt-superpowers-router"

# Secrets (never commit values):
# npx wrangler secret put GATEWAY_AUTH_TOKEN
# npx wrangler secret put IDX_BRIDGE_AUTH_TOKEN
# npx wrangler secret put VOICE_BRIDGE_AUTH_TOKEN
# npx wrangler secret put SUPERPOWERS_ROUTER_TOKEN
