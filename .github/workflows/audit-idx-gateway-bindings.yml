name: Audit IDX Gateway Bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-idx-gateway-bindings.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect binding names only
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: '0424a0a1799c8b3b7f0947a4e3a202ba'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['CF_API_TOKEN']; acct=os.environ['CF_ACCOUNT_ID']
          for script in ['idx-mcp-bridge','listing-team-ai-gateway']:
            req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{acct}/workers/scripts/{script}/settings',
              headers={'Authorization':'Bearer '+token}
            )
            with urllib.request.urlopen(req,timeout=30) as r:
              result=json.load(r).get('result',{})
            bindings=[{'name':b.get('name'),'type':b.get('type')} for b in result.get('bindings',[])]
            print(script, json.dumps(bindings, sort_keys=True))
          PY
