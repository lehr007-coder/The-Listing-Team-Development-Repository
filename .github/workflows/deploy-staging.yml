name: Deploy Staging Workers

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: {}

# Gate: real deploys to the shared staging workers happen only from main
# or a manual "Run workflow". Pushes to claude/** feature branches run the
# same wrangler step with --dry-run, so they validate/build the worker and
# give a green/red signal without landing unfinished work on staging. To
# push a branch to staging on purpose, trigger this workflow manually.

# Opt wrangler-action into Node.js 24 ahead of GitHub's forced switch
# on 2026-06-02. Remove when the action publishes a Node-24-native release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-proxy:
    name: Deploy thelistingteamproxy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: thelistingteamproxy
          command: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'deploy --config wrangler.staging.toml' || 'deploy --dry-run --config wrangler.staging.toml' }}

  deploy-support-tickets:
    name: Deploy tlt-support-tickets-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: support-tickets
          command: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'deploy --config wrangler.staging.toml' || 'deploy --dry-run --config wrangler.staging.toml' }}

  deploy-brand-injector:
    name: Deploy ghl-brand-injector-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ghl-brand-injector
          command: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'deploy --config wrangler.staging.toml' || 'deploy --dry-run --config wrangler.staging.toml' }}

  deploy-ai-video-system:
    name: Deploy ai-video-system-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ai-video-system
          command: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'deploy --config wrangler.staging.toml' || 'deploy --dry-run --config wrangler.staging.toml' }}

  deploy-tos-proxy:
    name: Deploy tos-proxy-staging (Python/raw API deploy)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - name: Deploy via deploy.py
        working-directory: tos-proxy
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deploy.py
