name: Deploy tos-proxy-staging

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'tos-proxy/**'
      - '.github/workflows/deploy-tos-proxy-staging.yml'
  workflow_dispatch:

concurrency: deploy-tos-proxy-staging

jobs:
  deploy:
    name: Deploy tos-proxy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: node --check tos-proxy/worker.js
      # Transient go-live round (operator-approved): flip the two go-live
      # custom values via the worker's own kill-switch handler. Remove the
      # GOLIVE_* envs when done.
      - name: Deploy via Cloudflare API (bindings preserved)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOLIVE: '1'
          GOLIVE_CV_SETS: '[["tos_deadline_reminders_enabled","true"],["tos_cutover_pct","100"]]'
        run: python3 tos-proxy/deploy.py
