name: Audit Superpowers Secret Bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-superpowers-secret-bindings.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect binding names and deployments only
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: '0424a0a1799c8b3b7f0947a4e3a202ba'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['CF_API_TOKEN']; acct=os.environ['CF_ACCOUNT_ID']
          def get(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          for script in ['tlt-superpowers-router','listing-team-ai-gateway']:
            print('\nSCRIPT',script)
            s=get(f'/accounts/{acct}/workers/scripts/{script}/settings').get('result',{})
            bindings=s.get('bindings',[])
            print('bindings=',json.dumps([{'name':b.get('name'),'type':b.get('type')} for b in bindings],indent=2))
            d=get(f'/accounts/{acct}/workers/scripts/{script}/deployments').get('result',[])
            print('deployments=',json.dumps([{'id':x.get('id'),'created_on':x.get('created_on'),'versions':x.get('versions')} for x in d[:3]],indent=2))
          PY
