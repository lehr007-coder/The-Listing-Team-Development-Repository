name: Deploy Listing Team AI Gateway

on:
  push:
    branches: [main]
    paths:
      - 'listing-team-ai-gateway/**'
      - '.github/workflows/deploy-listing-team-ai-gateway.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The API token has access to more than one Cloudflare account; without
  # this wrangler exits with "More than one account available but unable to
  # select one in non-interactive mode". Same id as the other workflows here.
  CLOUDFLARE_ACCOUNT_ID: '0424a0a1799c8b3b7f0947a4e3a202ba'

jobs:
  deploy:
    name: Deploy listing-team-ai-gateway
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Deploy gateway
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '0424a0a1799c8b3b7f0947a4e3a202ba'
          workingDirectory: listing-team-ai-gateway
          command: deploy --config wrangler.toml
