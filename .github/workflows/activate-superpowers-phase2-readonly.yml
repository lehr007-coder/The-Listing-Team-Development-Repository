name: Activate Superpowers Phase 2 Read-Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-superpowers-phase2-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install and typecheck Gateway v0.5.0
        working-directory: listing-team-ai-gateway
        run: |
          set -euo pipefail
          npm install --include=dev --legacy-peer-deps
          npm run typecheck

      - name: Deploy Gateway with Phase 2 service bindings
        working-directory: listing-team-ai-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml

      - name: Install dedicated Phase 2 internal credentials
        working-directory: listing-team-ai-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          derive() {
            CONTEXT="$1" python3 - <<'PY'
          import hashlib, os
          print(hashlib.sha256((os.environ['CONTEXT']+':'+os.environ['CF_API_TOKEN']).encode()).hexdigest())
          PY
          }
          CRM_TOKEN="$(derive 'tlt-superpowers-crm-internal-v1')"
          YLOPO_TOKEN="$(derive 'tlt-superpowers-ylopo-internal-v1')"
          SQUARESPACE_TOKEN="$(derive 'tlt-superpowers-squarespace-internal-v1')"
          echo "::add-mask::$CRM_TOKEN"
          echo "::add-mask::$YLOPO_TOKEN"
          echo "::add-mask::$SQUARESPACE_TOKEN"
          printf '%s' "$CRM_TOKEN" | npx wrangler secret put CRM_MCP_INTERNAL_TOKEN --name listing-team-ai-gateway >/dev/null
          printf '%s' "$YLOPO_TOKEN" | npx wrangler secret put YLOPO_MCP_INTERNAL_TOKEN --name listing-team-ai-gateway >/dev/null
          printf '%s' "$SQUARESPACE_TOKEN" | npx wrangler secret put SQUARESPACE_MCP_INTERNAL_TOKEN --name listing-team-ai-gateway >/dev/null
          echo '{"ok":true,"installed":["CRM_MCP_INTERNAL_TOKEN","YLOPO_MCP_INTERNAL_TOKEN","SQUARESPACE_MCP_INTERNAL_TOKEN"]}'

      - name: Verify guarded Phase 2 read-only execution
        env:
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GATEWAY_AUTH_TOKEN:-}"
          echo "::add-mask::$GATEWAY_AUTH_TOKEN"
          URL='https://listing-team-ai-gateway.lehr007.workers.dev/tool/superpowers.execute_safe'

          probe() {
            NAME="$1"
            BODY="$2"
            OUT="/tmp/${NAME}.json"
            curl -fsS -X POST "$URL" \
              -H "Authorization: Bearer $GATEWAY_AUTH_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$BODY" > "$OUT"
            NAME="$NAME" OUT="$OUT" python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['OUT']))
          assert d.get('ok') is True, {'gateway_ok':d.get('ok'),'error':d.get('error')}
          inner=d.get('data') or {}
          assert inner.get('ok') is True, {'inner_ok':inner.get('ok')}
          assert inner.get('mode') == 'safe_read_only_execution', inner.get('mode')
          execution=(inner.get('routing') or {}).get('execution') or {}
          assert execution.get('can_execute_without_approval') is True
          assert execution.get('delete_permitted') is False
          assert execution.get('archive_permitted') is False
          print(json.dumps({
            'probe': os.environ['NAME'],
            'ok': True,
            'tool': inner.get('tool'),
            'mode': inner.get('mode'),
            'can_execute_without_approval': execution.get('can_execute_without_approval'),
            'delete_permitted': execution.get('delete_permitted'),
            'archive_permitted': execution.get('archive_permitted'),
            'downstream_result_present': inner.get('data') is not None
          }))
          PY
          }

          probe crm '{"request":"check the CRM bridge health using read-only access","tool":"crm.bridge_health_check","arguments":{}}'
          probe ylopo '{"request":"show a read-only Ylopo pipeline summary","tool":"ylopo.pipeline_summary","arguments":{}}'
          probe squarespace '{"request":"list Squarespace products using read-only access","tool":"squarespace.list_products","arguments":{"limit":1}}'
