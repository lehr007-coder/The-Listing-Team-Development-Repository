name: Deploy Superpowers Router Mirror

on:
  push:
    branches: [main]
    paths:
      - 'deploy-mirrors/tlt-superpowers-router/**'
      - '.github/workflows/deploy-superpowers-router-mirror.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy-mirrors/tlt-superpowers-router
    steps:
      - uses: actions/checkout@v5
      - name: Deploy generated mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '0424a0a1799c8b3b7f0947a4e3a202ba'
        run: npx --yes wrangler@4 deploy
      - name: Verify live router
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          BASE='https://tlt-superpowers-router.lehr007.workers.dev'
          ROUTER_TOKEN=$(python3 - <<'PY'
          import hashlib, os
          print(hashlib.sha256(('tlt-superpowers-router-v1:'+os.environ['CF_API_TOKEN']).encode()).hexdigest())
          PY
          )
          echo "::add-mask::$ROUTER_TOKEN"
          sleep 5
          curl -fsS "$BASE/health" | tee /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('service') == 'tlt-superpowers-router'
          assert d.get('policy',{}).get('never_delete_automatically') is True
          PY
          curl -fsS -X POST "$BASE/route" \
            -H "Authorization: Bearer $ROUTER_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"request":"check the CRM bridge health using read-only access"}' \
            | tee /tmp/route.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/route.json'))
          assert d.get('ok') is True
          assert any(x.get('id') == 'crm' for x in d.get('capabilities', []))
          assert d.get('intent',{}).get('readOnly') is True
          assert d.get('execution',{}).get('can_execute_without_approval') is True
          assert d.get('execution',{}).get('delete_permitted') is False
          assert d.get('execution',{}).get('archive_permitted') is False
          PY
