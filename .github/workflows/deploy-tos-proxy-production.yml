name: Deploy tos-proxy-production

# Production deploys are manual-only (workflow_dispatch with "DEPLOY" confirmation).
# After the very first deploy, set secrets from the Mac workspace:
#   npx wrangler secret put ANTHROPIC_API_KEY              --name tos-proxy
#   npx wrangler secret put TOS_PORTAL_SIGNING_SECRET      --name tos-proxy
#   npx wrangler secret put TOS_NOTIFY_GHL_WEBHOOK_URL     --name tos-proxy
#   npx wrangler secret put TOS_REVIEW_REQUEST_GHL_WEBHOOK_URL --name tos-proxy
# Then re-run to confirm bindings.

# DISABLED 2026-08-18 — see the note in deploy-staging.yml. This would put a
# decompiled June bundle onto PRODUCTION, wiping R1 multi-tenant routing, the
# deadline normaliser that protects 18 waived live records, the security
# headers and every fix shipped since. Last dispatched 2026-07-28.
#
# Production deploys come from the canonical repo:
#   github.com/lehr007-coder/the-listing-team-transaction-os  (proxy/)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deploy'
        required: true
        default: ''

concurrency: deploy-tos-proxy-production

jobs:
  refuse:
    name: Refused — deploy from the canonical repo
    runs-on: ubuntu-latest
    steps:
      - name: Explain and fail
        run: |
          echo "This workflow deploys tos-proxy/worker.js — a decompiled June bundle."
          echo "It would revert R1 multi-tenant routing, the deadline normaliser"
          echo "protecting 18 waived production records, the security headers, and"
          echo "every fix shipped since 2026-06-12."
          echo ""
          echo "Deploy production from:"
          echo "  github.com/lehr007-coder/the-listing-team-transaction-os"
          echo "  cd proxy && npm run deploy:prod"
          exit 1

