name: Deploy Cloudflare Ops MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy-mirrors/cloudflare-ops-mcp-server/**'
      - '.github/workflows/deploy-cloudflare-ops-mcp.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: '0424a0a1799c8b3b7f0947a4e3a202ba'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy-mirrors/cloudflare-ops-mcp-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy-mirrors/cloudflare-ops-mcp-server/package.json

      - name: Validate deployment authority
        shell: bash
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CF_READONLY_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_DEPLOY_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CF_READONLY_TOKEN" || { echo 'Missing dedicated CLOUDFLARE_READONLY_API_TOKEN'; exit 1; }
          test "$CF_DEPLOY_TOKEN" != "$CF_READONLY_TOKEN" || { echo 'Runtime read token must be separate from deployment token'; exit 1; }
          echo 'Credentialed deployment authority validated.'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Install least-privilege runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_READONLY_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_READONLY_API_TOKEN" | npx wrangler secret put CLOUDFLARE_READONLY_API_TOKEN
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID
          MCP_AUTH_TOKEN="$(printf '%s' "cloudflare-ops-mcp:${CLOUDFLARE_ACCOUNT_ID}" | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -binary | base64 | tr -d '\n')"
          printf '%s' "$MCP_AUTH_TOKEN" | npx wrangler secret put MCP_AUTH_TOKEN

      - name: Deploy Cloudflare Ops MCP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify health and fail-closed safety
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cloudflare-ops-mcp-server.lehr007.workers.dev/health'
          BODY="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 "$URL")"
          echo "$BODY" | grep -q '"status":"ok"'
          echo "$BODY" | grep -q '"read_only":true'
          echo "$BODY" | grep -q '"readonly_api_token":true'
          echo "$BODY" | grep -q '"account_id":true'
          echo "$BODY" | grep -q '"public_auth_required":true'
          echo "$BODY" | grep -q '"delete_permitted":false'
          echo "$BODY" | grep -q '"archive_permitted":false'

      - name: Verify authenticated read-only canary
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          URL='https://cloudflare-ops-mcp-server.lehr007.workers.dev/mcp'
          MCP_AUTH_TOKEN="$(printf '%s' "cloudflare-ops-mcp:${CLOUDFLARE_ACCOUNT_ID}" | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -binary | base64 | tr -d '\n')"
          UNAUTH_CODE="$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' -X POST "$URL" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"cloudflare_list_workers","arguments":{}}}')"
          test "$UNAUTH_CODE" = '401'
          BODY="$(curl --fail --silent --show-error -X POST "$URL" -H 'content-type: application/json' -H "Authorization: Bearer $MCP_AUTH_TOKEN" --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"cloudflare_list_workers","arguments":{}}}')"
          echo "$BODY" | grep -q '"result"'
          echo "$BODY" | grep -q '"count"'
          echo 'Cloudflare Ops MCP production read-only canary passed.'
