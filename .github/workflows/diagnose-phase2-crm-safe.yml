name: Diagnose Phase 2 Read-Only Execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-phase2-crm-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CRM, Ylopo, and Squarespace through existing Superpowers internal endpoint
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          ROUTER_TOKEN=$(python3 - <<'PY'
          import hashlib, os
          print(hashlib.sha256(('tlt-superpowers-router-v1:'+os.environ['CF_API_TOKEN']).encode()).hexdigest())
          PY
          )
          echo "::add-mask::$ROUTER_TOKEN"
          URL='https://listing-team-ai-gateway.lehr007.workers.dev/internal/superpowers/execute-safe'

          probe() {
            NAME="$1"
            BODY="$2"
            OUT="/tmp/${NAME}.json"
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer $ROUTER_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$BODY")
            NAME="$NAME" CODE="$CODE" OUT="$OUT" python3 - <<'PY'
          import json, os
          try:
              d=json.load(open(os.environ['OUT']))
          except Exception:
              d={}
          ex=((d.get('routing') or {}).get('execution') or {})
          print(json.dumps({
              'probe': os.environ['NAME'],
              'http': os.environ['CODE'],
              'ok': d.get('ok'),
              'error': d.get('error'),
              'mode': d.get('mode'),
              'tool': d.get('tool'),
              'capabilities': [x.get('id') for x in ((d.get('routing') or {}).get('capabilities') or [])],
              'can_execute_without_approval': ex.get('can_execute_without_approval'),
              'delete_permitted': ex.get('delete_permitted'),
              'archive_permitted': ex.get('archive_permitted'),
              'downstream_result_present': d.get('data') is not None
          }))
          PY
          }

          probe crm '{"request":"check the CRM bridge health using read-only access","tool":"crm.bridge_health_check","arguments":{}}'
          probe ylopo '{"request":"show a read-only Ylopo pipeline summary","tool":"ylopo.pipeline_summary","arguments":{}}'
          probe squarespace '{"request":"list Squarespace products using read-only access","tool":"squarespace.list_products","arguments":{"limit":1}}'
