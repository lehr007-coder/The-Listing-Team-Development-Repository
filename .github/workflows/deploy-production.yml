name: Deploy Production Workers

# Production deploys are intentionally manual.
# Trigger from the Actions tab ("Run workflow") or via gh CLI:
#   gh workflow run deploy-production.yml
#
# Uses prod wrangler.toml configs (no -staging suffix) for each worker.
# All workers deploy in parallel. If one fails, the others still run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deploy'
        required: true
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  guard:
    name: Confirm production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmation text must be 'DEPLOY' (got: '${{ github.event.inputs.confirm }}')"
            exit 1
          fi
          echo "Production deploy confirmed."

  deploy-proxy:
    name: Deploy thelistingteamproxy (prod)
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: thelistingteamproxy
          command: deploy --config wrangler.toml

  deploy-support-tickets:
    name: Deploy tlt-support-tickets (prod)
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: support-tickets
          command: deploy --config wrangler.toml

  deploy-brand-injector:
    name: Deploy ghl-brand-injector (prod)
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ghl-brand-injector
          command: deploy --config wrangler.toml

  deploy-ai-video-system:
    name: Deploy ai-video-system (prod)
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ai-video-system
          command: deploy --config wrangler.toml

# tos-proxy is deliberately NOT deployed from this workflow.
#
# Removed 2026-08-20. This job ran `tos-proxy/deploy_prod.py`, which uploads
# `tos-proxy/worker.js` - a decompiled June bundle, last touched 2026-07-28.
# Shipping it to production would revert R1 multi-tenant routing, the deadline
# normaliser protecting 18 waived live records, the security headers, and every
# fix since 2026-06-12.
#
# `deploy-tos-proxy-production.yml` was disabled on 2026-08-18 for exactly that
# reason - but that refusal did not protect this workflow, which still carried
# its own copy of the job. A dispatch on 2026-08-20 queued it; it was cancelled
# on the `production` environment gate before any job ran.
#
# Production tos-proxy deploys come from the canonical repo:
#   github.com/lehr007-coder/the-listing-team-transaction-os  (proxy/)
#
# Note that `deploy-staging.yml` has no tos-proxy job either - this was the only
# path by which this repo could reach production TOS.

  deploy-social-post-importer:
    name: Deploy social-post-importer (prod, Python/raw API deploy)
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Deploy via deploy_prod.py
        working-directory: social-post-importer-deploy
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deploy_prod.py
