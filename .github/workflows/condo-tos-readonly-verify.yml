name: Condo Intel TOS Read-Only Verification

on:
  push:
    branches:
      - audit/cloudflare-runtime-2026-09-01
    paths:
      - '.github/workflows/condo-tos-readonly-verify.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: '0424a0a1799c8b3b7f0947a4e3a202ba'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed workers without modifying them
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          API='https://api.cloudflare.com/client/v4'
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"
          ACCT="${CF_ACCOUNT_ID}"

          # Download deployed bundles only to the ephemeral runner. They are never uploaded.
          curl -sS -H "$AUTH" "$API/accounts/$ACCT/workers/scripts/condo-intel-v2-worker" -o /tmp/condo.bundle
          curl -sS -H "$AUTH" "$API/accounts/$ACCT/workers/scripts/tos-proxy" -o /tmp/tos.bundle

          count_marker() {
            local file="$1" marker="$2"
            python3 - "$file" "$marker" <<'PY'
          import sys
          p,m=sys.argv[1:3]
          try:
              b=open(p,'rb').read()
              print(b.count(m.encode()))
          except Exception:
              print(0)
          PY
          }

          jq -n \
            --argjson isMarketplaceEvent "$(count_marker /tmp/condo.bundle isMarketplaceEvent)" \
            --argjson ghl_marketplace "$(count_marker /tmp/condo.bundle ghl_marketplace)" \
            --argjson InboundMessage "$(count_marker /tmp/condo.bundle InboundMessage)" \
            --argjson handleInstallEvent "$(count_marker /tmp/condo.bundle handleInstallEvent)" \
            --argjson APP_PAYMENT_STATUS "$(count_marker /tmp/condo.bundle APP_PAYMENT_STATUS)" \
            --argjson missing_signature_header "$(count_marker /tmp/condo.bundle missing_signature_header)" \
            '{worker:"condo-intel-v2-worker",markers:{isMarketplaceEvent:$isMarketplaceEvent,ghl_marketplace:$ghl_marketplace,InboundMessage:$InboundMessage,handleInstallEvent:$handleInstallEvent,APP_PAYMENT_STATUS:$APP_PAYMENT_STATUS,missing_signature_header:$missing_signature_header}}' \
            > verify/condo-deployed-markers.json

          jq -n \
            --argjson syncToCondoIntelBestEffort "$(count_marker /tmp/tos.bundle syncToCondoIntelBestEffort)" \
            --argjson condo_sync "$(count_marker /tmp/tos.bundle condo-intel)" \
            '{worker:"tos-proxy",markers:{syncToCondoIntelBestEffort:$syncToCondoIntelBestEffort,condo_intel_string:$condo_sync}}' \
            > verify/tos-deployed-markers.json

          # Read settings, but output values ONLY for a small allowlist of non-secret operational URLs/flags.
          curl -sS -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/accounts/$ACCT/workers/scripts/condo-intel-v2-worker/settings" -o /tmp/condo.settings.json
          curl -sS -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/accounts/$ACCT/workers/scripts/tos-proxy/settings" -o /tmp/tos.settings.json

          jq '{
            worker:"condo-intel-v2-worker",
            safe_plain_text:[(.result.bindings // [])[] | select(.type=="plain_text" and (.name=="TOS_PROXY_BASE_URL" or .name=="WEB_APP_BASE_URL" or .name=="GHL_SAFE_MODE" or .name=="AI_PROVIDER" or .name=="OCR_PROVIDER")) | {name,value:(.text // .value // null)}]
          }' /tmp/condo.settings.json > verify/condo-safe-settings.json

          jq '{
            worker:"tos-proxy",
            safe_plain_text:[(.result.bindings // [])[] | select(.type=="plain_text" and (.name=="CONDO_INTEL_BASE_URL" or .name=="TOS_PUBLIC_BASE_URL" or .name=="TOS_CONDO_SYNC_ENABLED" or .name=="TOS_READ_ONLY" or .name=="TOS_WRITE_ENABLED")) | {name,value:(.text // .value // null)}]
          }' /tmp/tos.settings.json > verify/tos-safe-settings.json

          # Public GET probes only. No webhook POSTs and no state changes.
          for pair in \
            'condo_health https://condo-intel-v2-worker.lehr007.workers.dev/health' \
            'condo_pages_health https://condo-intel-web.pages.dev/api/healthz' \
            'tos_home https://tos.reallistingteam.com/'; do
            set -- $pair
            name="$1"; url="$2"
            code=$(curl -sS -L -o "/tmp/${name}.body" -w '%{http_code}' "$url" || true)
            printf '{"name":"%s","url":"%s","http_status":%s}\n' "$name" "$url" "${code:-0}" > "verify/${name}.json"
          done

          rm -f /tmp/condo.bundle /tmp/tos.bundle /tmp/condo.settings.json /tmp/tos.settings.json /tmp/*.body

      - uses: actions/upload-artifact@v4
        with:
          name: condo-tos-readonly-verify-2026-09-01
          path: verify/
          retention-days: 30
