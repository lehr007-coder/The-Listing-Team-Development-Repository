name: Deploy ai-video-system Staging

# Separate workflow files (not folded into deploy-staging.yml / deploy-production.yml)
# so the AI Video sidecar can be rolled back by disabling these files alone,
# without touching the existing 3-worker pipeline.
#
# Production deploys live in .github/workflows/deploy-ai-video-production.yml
# (workflow_dispatch only, gated by the `production` environment).

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'ai-video-system/**'
      - '.github/workflows/deploy-ai-video-staging.yml'
  workflow_dispatch:

env:
  # The API token has access to more than one Cloudflare account; without
  # this wrangler exits with "More than one account available but unable to
  # select one in non-interactive mode". Same id as the other workflows here.
  CLOUDFLARE_ACCOUNT_ID: '0424a0a1799c8b3b7f0947a4e3a202ba'

jobs:
  deploy-ai-video:
    name: Deploy ai-video-system-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      # Gate: real deploys only from main or a manual run. claude/** branch
      # pushes validate with --dry-run so unfinished work doesn't land on
      # the shared staging worker.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ai-video-system
          command: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'deploy --config wrangler.staging.toml' || 'deploy --dry-run --config wrangler.staging.toml' }}
          secrets: |
            CF_STREAM_API_TOKEN
        env:
          CF_STREAM_API_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_API_TOKEN }}
