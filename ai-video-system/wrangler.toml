name = "ai-video-system"
main = "worker.js"
compatibility_date = "2024-12-01"

# Disable the *.workers.dev preview URL on production. We have custom
# domains (videos./media.reallistingteam.com) for traffic; the workers.dev
# URL would expose prod via an unbranded subdomain.
workers_dev = false
preview_urls = false

# ── Production worker config ──
# Secrets are set via `npx wrangler@latest secret put <NAME> --config wrangler.toml`.
# See README.md / docs/DEPLOYMENT.md for the full secret list.

[vars]
ENVIRONMENT = "production"
BASE_URL = "https://videos.reallistingteam.com"
MEDIA_BASE_URL = "https://media.reallistingteam.com"
CDN_BASE_URL = "https://cdn.reallistingteam.com"
HOSTED_BASE_URL = "https://videos.reallistingteam.com"
DEFAULT_BRAND = "the-listing-team"

# Cost-runaway guardrails. Both reset daily (UTC). KV-backed.
# Override via wrangler secret put if you want different prod limits.
DAILY_RENDER_LIMIT = "100"
PER_CONTACT_DAILY_LIMIT = "3"

# ── R2: rendered video assets (MP4 originals) ──
[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "tlt-ai-video"

# ── R2: GIF previews + thumbnails ──
[[r2_buckets]]
binding = "PREVIEW_BUCKET"
bucket_name = "tlt-ai-video-previews"

# ── KV: render status, callback dedupe, short-url maps ──
[[kv_namespaces]]
binding = "VIDEO_KV"
id = "1e513d6498444e9e89af431f2308aba1"

# ── Cron: HeyGen poll fallback for stuck-rendering jobs ──
# Runs once a minute. Picks up renders whose HeyGen webhook didn't fire.
[triggers]
crons = ["* * * * *"]

# ── Queue: ai-video-render ──
# Provision once before first deploy:
#   npx wrangler@latest queues create ai-video-render
[[queues.producers]]
queue = "ai-video-render"
binding = "RENDER_QUEUE"

[[queues.consumers]]
queue = "ai-video-render"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# ── Custom domain for hosted video pages ──
# Bind in Cloudflare Dashboard:
#   ai-video-system → Settings → Triggers → Custom Domains
#   • videos.reallistingteam.com  (hosted player + tracking pixels)
#   • media.reallistingteam.com   (R2 MP4/GIF/JPG passthrough)
