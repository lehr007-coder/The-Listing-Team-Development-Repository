name = "ai-video-system"
main = "worker.js"
compatibility_date = "2024-12-01"

# Disable the *.workers.dev preview URL on production. We have custom
# domains (videos./media.reallistingteam.com) for traffic; the workers.dev
# URL would expose prod via an unbranded subdomain.
workers_dev = false
preview_urls = false

# ── Production worker config ──
# Secrets are set via `npx wrangler@latest secret put <NAME> --config wrangler.toml`.
# See README.md / docs/DEPLOYMENT.md for the full secret list.

[vars]
ENVIRONMENT = "production"
BASE_URL = "https://videos.reallistingteam.com"
MEDIA_BASE_URL = "https://media.reallistingteam.com"
CDN_BASE_URL = "https://cdn.reallistingteam.com"
HOSTED_BASE_URL = "https://videos.reallistingteam.com"
DEFAULT_BRAND = "the-listing-team"

# Cost-runaway guardrails. All three reset daily (UTC). KV-backed.
# Override via wrangler secret put if you want different prod limits.
DAILY_RENDER_LIMIT = "100"
PER_CONTACT_DAILY_LIMIT = "3"
PER_LOCATION_DAILY_LIMIT = "50"

# Phase 8 — Weekly report recipients (comma-separated GHL contact IDs).
# Each contact in this list receives the weekly performance report email
# via the existing GHL conversations path. Empty = cron skips sending,
# manual POST /v1/admin/reports/weekly/send still works with explicit recipients.
WEEKLY_REPORT_CONTACT_IDS = ""

# GHL sub-account location ID — required for email→contact_id lookup via
# POST /contacts/search. Same value used by thelistingteamproxy.
GHL_LOCATION_ID = "SeZr4YCwEZ50IcWqylkQ"

# Cloudflare Stream customer code — used to build thumbnail/gif/iframe
# URLs. Account-wide value, NOT per-video. Find via Stream → API → any
# playback URL contains `customer-<code>.cloudflarestream.com`.
CF_STREAM_CUSTOMER_CODE = "l2o0igwtm8ovwtt8"

# ── HeyGen branded templates per video_type ──
# Each template has Scott Lehr's avatar + voice + branded intro/outro/
# lower-third pre-baked. lib/heygen.js#createAvatarVideo uses the
# template ID when present (POST /v2/template/{id}/generate with
# {{script}} as a variable). Falls back to /v2/video/generate +
# HEYGEN_DEFAULT_AVATAR_ID if a template ID is missing.
HEYGEN_TEMPLATE_SELLER_VALUATION     = "a518d5823c0347a5b7ea2739fd0b7d73"
HEYGEN_TEMPLATE_FSBO_OUTREACH        = "ce1a75dfa84b4840a3d695bfa958e774"
HEYGEN_TEMPLATE_EXPIRED_LISTING      = "3984941c20154ceaa020a2bfdfe0adeb"
HEYGEN_TEMPLATE_BUYER_ACTIVITY       = "4d2dc31a1cb54506b36810f53624e18b"
HEYGEN_TEMPLATE_NEW_LISTING_MATCH    = "b0c16ca6bafc4164af9f85321342b2bf"
HEYGEN_TEMPLATE_MARKET_UPDATE        = "45cd3449304a48bf80b7bd9c3e7787df"
HEYGEN_TEMPLATE_OPEN_HOUSE_INVITE    = "a6e566fb0d204a0ca4509337f04c39de"
HEYGEN_TEMPLATE_SHOWING_REQUEST      = "11115ca9328f404a9cc12498fd4a656c"
HEYGEN_TEMPLATE_APPOINTMENT_REMINDER = "32d1f8bc66054294a1725c1b3b0faf0b"
HEYGEN_TEMPLATE_MORTGAGE_UPDATE      = "87bd4fb02d55485886f55e1b58cbcf97"
HEYGEN_TEMPLATE_LEAD_NURTURE         = "c47b38c1f9f74deb819bed53b8c5da1f"
HEYGEN_TEMPLATE_PRIORITY_LEAD        = "4858fc92548544509f93d9055c0039e3"

# ── R2: rendered video assets (MP4 originals) ──
[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "tlt-ai-video"

# ── R2: GIF previews + thumbnails ──
[[r2_buckets]]
binding = "PREVIEW_BUCKET"
bucket_name = "tlt-ai-video-previews"

# ── KV: render status, callback dedupe, short-url maps ──
[[kv_namespaces]]
binding = "VIDEO_KV"
id = "1e513d6498444e9e89af431f2308aba1"

# ── Cron: HeyGen poll fallback for stuck-rendering jobs ──
# Catches jobs where the HeyGen webhook never fired. Cron runs every minute.
# Each recovered job is dispatched as a self-fetch to /v1/admin/jobs/:id/reprocess
# so it runs in its own fresh HTTP Worker invocation with its own CPU budget.
# ctx.waitUntil tracks all dispatches — the scheduled handler itself is lightweight.
[triggers]
crons = [
  "* * * * *",      # heygen poll-fallback (every minute)
  "0 14 * * 1",     # weekly report (Mon 14:00 UTC = 9am ET / 10am EDT)
]

# ── Queue: ai-video-render ──
# Provision once before first deploy:
#   npx wrangler@latest queues create ai-video-render
[[queues.producers]]
queue = "ai-video-render"
binding = "RENDER_QUEUE"

[[queues.consumers]]
queue = "ai-video-render"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# ── Custom domain for hosted video pages ──
# Bind in Cloudflare Dashboard:
#   ai-video-system → Settings → Triggers → Custom Domains
#   • videos.reallistingteam.com  (hosted player + tracking pixels)
#   • media.reallistingteam.com   (R2 MP4/GIF/JPG passthrough)
