name = "ai-video-system-staging"
main = "worker.js"
compatibility_date = "2024-12-01"

[vars]
ENVIRONMENT = "staging"
BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
MEDIA_BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
CDN_BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
HOSTED_BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
DEFAULT_BRAND = "the-listing-team"

# Generous limits for staging — testing can burst more
DAILY_RENDER_LIMIT = "200"
PER_CONTACT_DAILY_LIMIT = "10"
PER_LOCATION_DAILY_LIMIT = "200"

# Phase 8 — Weekly report recipients (comma-separated GHL contact IDs).
# Empty in staging by default; populate via wrangler secret put for testing.
WEEKLY_REPORT_CONTACT_IDS = ""

# Cloudflare Stream customer code (same account as prod)
CF_STREAM_CUSTOMER_CODE = "l2o0igwtm8ovwtt8"

# ── HeyGen branded templates per video_type — same IDs work in both envs
HEYGEN_TEMPLATE_SELLER_VALUATION     = "a518d5823c0347a5b7ea2739fd0b7d73"
HEYGEN_TEMPLATE_FSBO_OUTREACH        = "ce1a75dfa84b4840a3d695bfa958e774"
HEYGEN_TEMPLATE_EXPIRED_LISTING      = "3984941c20154ceaa020a2bfdfe0adeb"
HEYGEN_TEMPLATE_BUYER_ACTIVITY       = "4d2dc31a1cb54506b36810f53624e18b"
HEYGEN_TEMPLATE_NEW_LISTING_MATCH    = "b0c16ca6bafc4164af9f85321342b2bf"
HEYGEN_TEMPLATE_MARKET_UPDATE        = "45cd3449304a48bf80b7bd9c3e7787df"
HEYGEN_TEMPLATE_OPEN_HOUSE_INVITE    = "a6e566fb0d204a0ca4509337f04c39de"
HEYGEN_TEMPLATE_SHOWING_REQUEST      = "11115ca9328f404a9cc12498fd4a656c"
HEYGEN_TEMPLATE_APPOINTMENT_REMINDER = "32d1f8bc66054294a1725c1b3b0faf0b"
HEYGEN_TEMPLATE_MORTGAGE_UPDATE      = "87bd4fb02d55485886f55e1b58cbcf97"
HEYGEN_TEMPLATE_LEAD_NURTURE         = "c47b38c1f9f74deb819bed53b8c5da1f"
HEYGEN_TEMPLATE_PRIORITY_LEAD        = "4858fc92548544509f93d9055c0039e3"

# ── R2 buckets (provisioned in CF account 0424a0a1799c8b3b7f0947a4e3a202ba) ──
[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "tlt-ai-video-staging"

[[r2_buckets]]
binding = "PREVIEW_BUCKET"
bucket_name = "tlt-ai-video-previews-staging"

# ── KV namespace (provisioned via MCP) ──
[[kv_namespaces]]
binding = "VIDEO_KV"
id = "444a0a7edeb24d00b6063e3f17437efc"

# ── Cron: HeyGen poll fallback for stuck-rendering jobs ──
# REMOVED to match prod while we verify the HeyGen webhook is the
# reliable primary delivery path. See wrangler.toml for the full
# context note. Re-enable by uncommenting:
#
[triggers]
crons = [
  "* * * * *",      # heygen poll-fallback (every minute)
  "0 14 * * 1",     # weekly report (Mon 14:00 UTC)
]

# ── Queue: ai-video-staging-render-queue (created via dashboard) ──
[[queues.producers]]
queue = "ai-video-staging-render-queue"
binding = "RENDER_QUEUE"

[[queues.consumers]]
queue = "ai-video-staging-render-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
