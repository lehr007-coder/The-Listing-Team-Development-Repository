name = "ai-video-system-staging"
main = "worker.js"
compatibility_date = "2024-12-01"

[vars]
ENVIRONMENT = "staging"
BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
MEDIA_BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
CDN_BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
HOSTED_BASE_URL = "https://ai-video-system-staging.lehr007.workers.dev"
DEFAULT_BRAND = "the-listing-team"

# ── R2 buckets (provisioned in CF account 0424a0a1799c8b3b7f0947a4e3a202ba) ──
[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "tlt-ai-video-staging"

[[r2_buckets]]
binding = "PREVIEW_BUCKET"
bucket_name = "tlt-ai-video-previews-staging"

# ── KV namespace (provisioned via MCP) ──
[[kv_namespaces]]
binding = "VIDEO_KV"
id = "444a0a7edeb24d00b6063e3f17437efc"

# ── Queue intentionally OMITTED for staging ──
# The worker auto-falls-back to ctx.waitUntil inline processing when
# RENDER_QUEUE binding is missing (see lib/queue-producer.js). To enable
# the durable Queue path, run from a machine with wrangler CLI:
#   npx wrangler queues create ai-video-render-staging
# then add:
#   [[queues.producers]]  queue = "ai-video-render-staging"  binding = "RENDER_QUEUE"
#   [[queues.consumers]]  queue = "ai-video-render-staging"  max_batch_size = 10
